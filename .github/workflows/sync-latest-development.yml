name: Sync latest PlantCausal development

on:
  push:
    paths:
      - .github/workflows/sync-latest-development.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest development source
        run: |
          rm -rf /tmp/plantcausal-development
          git clone --depth 1 --branch dev https://github.com/anhuikylin/PlantCausal.git /tmp/plantcausal-development

      - name: Synchronize complete development tree
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/sync-latest-development.yml' \
            /tmp/plantcausal-development/ ./

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test synchronized development
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Validate executable and public data import
        run: |
          java -jar target/plantcausal-core-0.4.0.jar validate examples/synthetic
          java -jar target/plantcausal-core-0.4.0.jar import-pine benchmark/raw/10100580/Mycorrhiza_exposure_drought.xlsx "$RUNNER_TEMP/pine"
          java -jar target/plantcausal-core-0.4.0.jar validate "$RUNNER_TEMP/pine"
          java -jar target/plantcausal-core-0.4.0.jar stage-grass benchmark/raw/4306840/181004_Biomass_2014.xls "$RUNNER_TEMP/grass"

      - name: Run causal demos and export PDF
        run: |
          java -jar target/plantcausal-core-0.4.0.jar demo-maize benchmark/examples/maize_salt_stress target/PlantCausal_Demo_Report.pdf
          java -jar target/plantcausal-core-0.4.0.jar analyze examples/linear_verification target/linear-verification --covariates=baseline_x
          java -jar target/plantcausal-core-0.4.0.jar analyze examples/baseline_causal_verification target/aipw-verification --estimator=AIPW --missing=IPCW --covariates=baseline_x1,baseline_x2
          java -jar target/plantcausal-core-0.4.0.jar analyze examples/longitudinal_verification target/msm-verification --estimator=MSM_IPW --missing=IPCW --covariates=baseline_z --time-varying=history_l

      - name: Record synchronized source revision
        run: git -C /tmp/plantcausal-development rev-parse HEAD > DEVELOPMENT_SOURCE_SHA

      - name: Commit synchronized development
        run: |
          git config user.name "omixcore"
          git config user.email "fei48548@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No synchronization changes."
            exit 0
          fi
          git commit -m "Sync latest PlantCausal development"
          git push origin HEAD:main
